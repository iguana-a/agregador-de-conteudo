services:
  postgres:
    image: postgres:18-alpine
    container_name: content-aggregator-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=content_aggregator
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
volumes: 
  postgres_data: